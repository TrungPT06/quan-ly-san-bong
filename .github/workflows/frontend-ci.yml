name: Frontend CI (Vue 3)

on:
  push:
    paths:
      - 'QuanLySanBong/fe-vue/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'QuanLySanBong/fe-vue/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, Test & Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: QuanLySanBong/fe-vue

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: QuanLySanBong/fe-vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Component & UI smoke test
        run: npm run test:ui

      - name: Build production
        run: npm run build
        env:
          VITE_BASE: /
